<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Chat App</title>
    <!-- Import Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Import FontAwesome untuk Ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 h-screen overflow-hidden text-gray-800 font-sans">

    <!-- HALAMAN LOGIN -->
    <div id="login-page" class="fixed inset-0 bg-teal-500 flex justify-center items-center z-50">
        <div class="bg-white p-8 rounded-lg shadow-xl w-96 max-w-full">
            <h2 class="text-2xl font-bold text-center text-gray-700 mb-6">Login Chat</h2>
            <form id="login-form">
                <div class="mb-4">
                    <label class="block text-gray-600 text-sm mb-2">Username</label>
                    <input type="text" id="username" class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-teal-400" placeholder="Contoh: user1" required>
                </div>
                <div class="mb-6">
                    <label class="block text-gray-600 text-sm mb-2">Password</label>
                    <input type="password" id="password" class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-teal-400" placeholder="Contoh: 12345" required>
                </div>
                <p id="login-error" class="text-red-500 text-sm mb-4 hidden">Username atau Password salah!</p>
                <button type="submit" class="w-full bg-teal-600 text-white py-2 rounded-md hover:bg-teal-700 transition">Masuk</button>
            </form>
            <div class="mt-4 text-center text-sm text-gray-500">
                <p>Gunakan <b>user1</b> / <b>12345</b></p>
            </div>
        </div>
    </div>

    <!-- TAMPILAN UTAMA APLIKASI -->
    <div id="app-container" class="hidden h-screen w-full flex bg-white relative shadow-2xl overflow-hidden mx-auto max-w-[1600px]">
        
        <!-- SIDEBAR (Daftar Kontak) -->
        <div id="sidebar" class="w-full md:w-1/3 lg:w-1/4 flex flex-col border-r bg-white h-full z-10 transition-transform">
            <!-- Header Sidebar -->
            <div class="bg-gray-100 h-16 flex justify-between items-center px-4 border-b">
                <div class="flex items-center gap-3">
                    <img src="https://i.pravatar.cc/150?img=11" alt="My Profile" class="w-10 h-10 rounded-full">
                    <span class="font-semibold text-gray-700">Profil Saya</span>
                </div>
                <button id="logout-btn" class="text-gray-600 hover:text-red-500 transition" title="Logout">
                    <i class="fa-solid fa-right-from-bracket text-xl"></i>
                </button>
            </div>
            <!-- Search Bar -->
            <div class="p-3 bg-white border-b">
                <div class="relative">
                    <i class="fa-solid fa-search absolute left-3 top-3 text-gray-400"></i>
                    <input type="text" class="w-full bg-gray-100 rounded-lg pl-10 pr-4 py-2 focus:outline-none text-sm" placeholder="Cari obrolan...">
                </div>
            </div>
            <!-- Contact List -->
            <div id="contact-list" class="flex-1 overflow-y-auto custom-scrollbar">
                <!-- Kontak akan dirender dari JS -->
            </div>
        </div>

        <!-- AREA OBROLAN -->
        <div id="chat-area" class="hidden md:flex w-full md:w-2/3 lg:w-3/4 flex-col h-full bg-[#efeae2] relative absolute inset-0 md:static z-20">
            <!-- Header Chat -->
            <div class="bg-gray-100 h-16 flex items-center px-4 border-b gap-4">
                <button id="back-btn" class="md:hidden text-gray-600 text-xl">
                    <i class="fa-solid fa-arrow-left"></i>
                </button>
                <img id="active-chat-img" src="" alt="Contact Profile" class="w-10 h-10 rounded-full hidden">
                <div class="flex-1">
                    <h3 id="active-chat-name" class="font-semibold text-gray-800">Pilih obrolan</h3>
                    <p id="active-chat-status" class="text-xs text-gray-500 hidden">Online</p>
                </div>
            </div>

            <!-- Area Pesan (Riwayat Obrolan) -->
            <div id="messages-container" class="flex-1 overflow-y-auto p-4 custom-scrollbar flex flex-col gap-2">
                <!-- Placeholder jika belum ada kontak terpilih -->
                <div class="flex items-center justify-center h-full text-gray-500 bg-white/50 rounded-lg m-4">
                    Pilih kontak di sebelah kiri untuk mulai mengobrol.
                </div>
            </div>

            <!-- Input Pesan -->
            <form id="message-form" class="bg-gray-100 p-3 flex items-center gap-3 hidden">
                <button type="button" class="text-gray-500 text-xl hover:text-gray-700">
                    <i class="fa-regular fa-face-smile"></i>
                </button>
                <button type="button" class="text-gray-500 text-xl hover:text-gray-700">
                    <i class="fa-solid fa-paperclip"></i>
                </button>
                <input type="text" id="message-input" class="flex-1 px-4 py-2 rounded-lg border-none focus:outline-none" placeholder="Ketik pesan" autocomplete="off">
                <button type="submit" class="text-teal-600 text-xl hover:text-teal-800">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
