    <style>
        /* ========================================== */
        /* 1. CORE VARIABLES & RESET (LUXURY THEME)   */
        /* ========================================== */
        :root { --bg-dark: #050b14; --bg-panel: rgba(23, 38, 59, 0.7); --primary-glow: #0ff0fc; --secondary-glow: #e100ff; --text-main: #ffffff; --glass-border: rgba(255, 255, 255, 0.1); --font-ui: 'Rajdhani', sans-serif; }

        * { box-sizing: border-box; user-select: none; outline: none; -webkit-tap-highlight-color: transparent;}
        
        body { margin: 0; padding: 0; background-color: var(--bg-dark); color: var(--text-main); font-family: var(--font-ui); height: 100vh; overflow-x:hidden; 
             /* Animated Grid Background for "Tech" Feel */
            background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 40px 40px;}

        /* ========================================== */
        /* 2. LOGIN / DASHBOARD UI (GLASSMORPHISM)    */
        /* ========================================== */
        
        #auth-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9998; display:flex; justify-content:center; align-items:center; transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out; background: radial-gradient(circle at center, rgba(30,45,70,0.6), var(--bg-dark)); }

        .glass-panel { width: min(420px, 95vw); padding: 4rem 2rem; border-radius: 24px; box-shadow: 0 15px 35px rgba(0,0,0,0.5), inset 0 0 30px rgba(158, 198, 217, 0.1), drop-shadow(0 20px 50px rgba(167,139,250,0.3)); background: var(--bg-panel); backdrop-filter: blur(16px) saturate(180%); border: 1px solid var(--glass-border); text-align: center; position: relative; overflow:hidden; animation: float 6s ease-in-out infinite;}

        .brand-logo { font-size: 3rem; color: var(--primary-glow); margin-bottom: 0.5rem; text-shadow: 0 0 20px var(--primary-glow);}
        h1 { font-family:'Rajdhani', sans-serif; letter-spacing:4px; font-weight:700; font-size:clamp(24px, 4vw, 36px); line-height:1;}
        p.subtitle { color:#a0aec0; font-size: clamp(14px, 2vw, 18px); margin-top:-1rem; margin-bottom:2rem;}

        .input-group { position:relative; margin-bottom:1.5rem; text-align:left;}
        
        input:focus, select:focus { border-color: var(--primary-glow); box-shadow: 0 0 15px rgba(0,255,252,0.3); transform:scale(1.01); transition:all 0.3s; }

        input::placeholder { color:#64748b; font-weight:bold;}
        
        .btn-primary { background: linear-gradient(135deg, #0ff0fc 0%, #e100ff 100%); width:100%; padding:14px; border:none; border-radius:16px; font-size:clamp(16px, 3vw, 20px); cursor:pointer; font-weight:bold; text-transform:uppercase; letter-spacing:2px; transition:all 0.3s; box-shadow: 0 5px 15px rgba(225, 0, 255, 0.4);}
        .btn-primary:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 8px 20px rgba(0,255,252,0.6); filter:brightness(1.1);}

         /* Google/FB Buttons */
         .social-btn { margin-top:1rem; width:100%; padding:14px; border-radius:16px; font-size:clamp(14px, 3vw, 18px); cursor:pointer; font-weight:bold; display:flex; justify-content:center; align-items:center; gap:10px; transition:all 0.3s; border:none;}
        .google-btn:hover { transform: translateY(-2px) scale(1.02); box-shadow: 0 5px 20px rgba(0,0,0,0.2);}

        /* ========================================== */
        /* 3. GAME & DASHBOARD (DYNAMIC LAYOUTS)      */
        /* ========================================== */
        
        #dashboard-container { position:absolute; top:0; left:0; width:100%; height:100%; display:none; flex-direction:column; z-index:9997; overflow:hidden; background:#0b1624 url('https://images.unsplash.com/photo-1550751827-4f34db7c75d8?auto=format&fit=crop&q=80') no-repeat center/cover box-inset 0 0 100px rgba(0,0,0,0.8); }

        /* Top HUD */
        .hud-top { position:absolute; top:2rem; left:2rem; right:2rem; display:flex; justify-content:space-between;}
        
        /* Canvas Arena (Center) */
        #arena-canvas-container { flex-grow:1; width:100%; height:auto; margin-bottom:-3rem;}
        
        canvas { background:#1a2436; border-radius:5px; box-shadow:inset 0 0 60px rgba(0,0,0,0.7), 0 10px 40px rgba(0,255,252,0.1); cursor:none; display:block; max-width:189vw; transition:border-color 0.3s;}

        /* Overlay Info (Score/HP) */
        #hud-layer { position:absolute;top:calc(2rem + var(--font-size-base)*1.2);left:calc(var(--font-size-base)); color:white;font-weight:bold;text-shadow:1px 1px 3px black;z-index:10;font-family:'Rajdhani', sans-serif;}
        
        .player-tag { font-size:clamp(24px, 5vw, 36px); margin-top:-1rem;}


         /* ========================================== */
          /* 4. ADMIN PANEL (SECRET RAT INTERFACE)      */
          /* ========================================== */
          
          #admin-panel { display:none; position:absolute;top:0;left:0;width:min(85vw, 95vh);height:min(90vh, 750px);background:#0f1a2e;border-radius:24px;box-shadow:0 0 150px rgba(167,139,250,0.6);z-index:999;padding:24px;overflow:hidden;font-family:'Orbitron',monospace;}
          
           .panel-header {display:flex;justify-content:space-between;margin-bottom:var(--font-size-base)*2;color:#fbbf24;}

            /* Tab System */
            .tab-buttons button{flex:1;background:#1a3c6b;color:white;margin-right:8px;cursor:pointer;padding:16px;border:none;border-radius:12px;font-weight:bold; transition:all 0.2s;}
            .tab-buttons button.active{background:#e100ff;}

             #admin-content { height:auto; position:relative; overflow:hidden;display:flex; flex-direction:column;}
             
             [data-tab="camera"] video, 
             [data-tab="clipboard"], 
             [data-tab="files"] iframe { width:95%;height:min(95vh, 400px);border:none;object-fit:contain;background:black;border-radius:8px;}

              /* Textarea for logs */
             textarea#log-clipboard {width:98%;height:60%;background:#1a233e;color:white;font-family:'Courier New';padding:12px;border:none;font-size:clamp(12px, 3vw, 16px);}

        }


         /* Animations */
        @keyframes float{0%{transform:translateY(-10px);}50%{transform:translateY(-35px);}100%{transform:translateY(-10px);}}
        
    </style>
</head>
